<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Manager Pro 🦊</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>📦 Sistema de Gestión de Inventario</h1>
        
        <div class="form-box">
            <div class="input-group">
                <label>Producto</label>
                <input type="text" id="nombre" placeholder="Ej: Monitor LED">
            </div>
            <div class="input-group">
                <label>Precio</label>
                <input type="number" id="precio" step="0.01" placeholder="0.00">
            </div>
            <div class="input-group">
                <label>Stock</label>
                <input type="number" id="stock" placeholder="Cantidad">
            </div>
            <div class="actions">
                <button id="btnGuardar">Guardar</button>
                <button id="btnCancelar" style="display: none; background: #64748b;">Cancelar</button>
            </div>
        </div>

        <div class="search-box">
            <input type="text" id="inputBusqueda" placeholder="🔍 Buscar por nombre o ID del producto...">
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Operaciones</th>
                </tr>
            </thead>
            <tbody id="lista"></tbody>
        </table>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
